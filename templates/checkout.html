<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zentra - Checkout</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --primary: #6366f1;
            --primary-dark: #5558e8;
            --text-dark: #172033;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --background: #f7f9fc;
            --white: #ffffff;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--background);
            color: var(--text-dark);
        }

        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            height: 72px;
            background: rgba(255,255,255,0.97);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-container {
            height: 100%;
            display: flex;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 23px;
            font-weight: 700;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 17px;
        }

        /* Search */

        .nav-search {
            width: 52%;
            margin-left: 120px;
            position: relative;
        }

        .nav-search input {
            width: 100%;
            height: 46px;
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 0 20px 0 48px;
            outline: none;
            font-size: 15px;
            color: var(--text-dark);
            transition: 0.2s;
        }

        .nav-search input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
        }

        .nav-search i {
            position: absolute;
            left: 18px;
            top: 15px;
            color: #718096;
        }

        /* Navigation */

        .nav-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 27px;
        }

        .nav-links a {
            text-decoration: none;
            color: #52627a;
            font-size: 15px;
            font-weight: 500;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .nav-icon {
            position: relative;
            color: #52627a;
            font-size: 19px;
            cursor: pointer;
        }

        .notification {
            position: absolute;
            top: -10px;
            right: -10px;

            width: 19px;
            height: 19px;

            background: var(--primary);
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 11px;
            font-weight: 600;
        }

        .profile {
            width: 39px;
            height: 39px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* =========================
           PAGE
        ========================== */

        .checkout-page {
            padding: 35px 0 80px;
        }

        /* Breadcrumb */

        .breadcrumb-custom {
            margin-bottom: 20px;
        }

        .breadcrumb-custom a {
            color: #66809e;
            text-decoration: none;
        }

        .breadcrumb-custom span {
            color: #9aa8b8;
            margin: 0 10px;
        }

        .breadcrumb-custom strong {
            color: var(--text-dark);
            font-weight: 500;
        }

        /* Heading */

        .page-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        /* =========================
           CHECKOUT STEPS
        ========================== */

        .checkout-steps {
            display: flex;
            align-items: center;
            margin-bottom: 35px;
        }

        .step {
            flex: 1;
            position: relative;
        }

        .step:not(:last-child) {
            margin-right: 10px;
        }

        .step-line {
            height: 5px;
            background: #e3e8f0;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .step.active .step-line {
            background: var(--primary);
        }

        .step-content {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #65809d;
            font-size: 15px;
            font-weight: 500;
        }

        .step-number {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #f0f3f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #69809b;
            font-size: 13px;
        }

        .step.active .step-number {
            background: var(--primary);
            color: white;
        }

        .step.active .step-content {
            color: var(--text-dark);
        }

        /* =========================
           CHECKOUT GRID
        ========================== */

        .checkout-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 375px;
            gap: 35px;
        }

        /* =========================
           FORM CARD
        ========================== */

        .checkout-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .card-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .form-control {
            height: 42px;
            border: 1px solid #dce3eb;
            border-radius: 8px;
            font-size: 14px;
            padding: 0 13px;
        }

        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Divider */

        .form-divider {
            height: 1px;
            background: var(--border);
            margin: 10px 0 25px;
        }

        /* Buttons */

        .back-btn {
            border: none;
            background: transparent;
            color: var(--text-dark);
            font-weight: 500;
            padding: 10px 15px;
        }

        .back-btn:hover {
            color: var(--primary);
        }

        .continue-btn {
            background: var(--primary);
            border: none;
            color: white;
            border-radius: 8px;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
        }

        .continue-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        /* =========================
           SUMMARY
        ========================== */

        .summary-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 27px;
            height: fit-content;
        }

        .summary-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 17px;
            font-size: 15px;
        }

        .summary-row .label {
            color: #68809c;
        }

        .summary-row .value {
            color: var(--text-dark);
            font-weight: 500;
        }

        .free {
            color: var(--success) !important;
        }

        .summary-divider {
            height: 1px;
            background: var(--border);
            margin: 22px 0;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
        }

        /* =========================
           SECURITY MESSAGE
        ========================== */

        .secure-box {
            margin-top: 20px;
            background: #ecfdf5;
            border-radius: 10px;
            padding: 16px;

            display: flex;
            gap: 12px;
            align-items: flex-start;

            color: #059669;
            font-size: 13px;
            line-height: 1.5;
        }

        .secure-box i {
            font-size: 18px;
            margin-top: 2px;
        }

        /* =========================
           RESPONSIVE
        ========================== */

        @media(max-width: 1100px) {

            .nav-search {
                margin-left: 40px;
                width: 45%;
            }

            .nav-links {
                gap: 18px;
            }

        }

        @media(max-width: 900px) {

            .checkout-grid {
                grid-template-columns: 1fr;
            }

            .summary-card {
                order: -1;
            }

            .nav-search {
                display: none;
            }

        }

        @media(max-width: 600px) {

            .navbar {
                height: 65px;
            }

            .nav-links a {
                display: none;
            }

            .checkout-page {
                padding-top: 25px;
            }

            .page-title {
                font-size: 24px;
            }

            .checkout-steps {
                overflow-x: auto;
                padding-bottom: 8px;
            }

            .step {
                min-width: 140px;
            }

            .checkout-card,
            .summary-card {
                padding: 20px;
            }

            .form-actions {
                flex-direction: column;
                gap: 10px;
            }

            .continue-btn {
                width: 100%;
            }

        }

    </style>
</head>

<body>

<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar">

    <div class="container navbar-container">

        <!-- Brand -->

        <a href="#" class="brand">

            <div class="brand-icon">
                <i class="fas fa-store"></i>
            </div>

            Zentra

        </a>


        <!-- Search -->

        <div class="nav-search">

            <i class="fas fa-search"></i>

            <input
                type="text"
                placeholder="Search products, brands, and categories"
            >

        </div>


        <!-- Navigation -->

        <div class="nav-links">

            <a href="#">Explore</a>

            <a href="#">Sell</a>


            <div class="nav-icon">

                <a href="message.html"><i class="far fa-comment-alt"></i></a>

                <span class="notification">3</span>

            </div>


            <div class="nav-icon">

                <i class="far fa-bell"></i>

                <span class="notification">2</span>

            </div>


            <div class="nav-icon">

                <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>

                <span class="notification">1</span>

            </div>


            <a href="profile.html">
                <img
                    class="profile"
                    src="https://i.pravatar.cc/100?img=12"
                    alt="Profile"
                >
            </a>

        </div>

    </div>

</nav>


<!-- =========================
     CHECKOUT PAGE
========================== -->

<main class="checkout-page">

    <div class="container">

        <!-- Breadcrumb -->

        <div class="breadcrumb-custom">

            <a href="#">Cart</a>

            <span>›</span>

            <strong>Checkout</strong>

        </div>


        <!-- Title -->

        <h1 class="page-title">
            Checkout
        </h1>


        <!-- Checkout Steps -->

        <div class="checkout-steps">

            <!-- Step 1 -->

            <div class="step active">

                <div class="step-line"></div>

                <div class="step-content">

                    <div class="step-number">
                        1
                    </div>

                    <span>
                        Address
                    </span>

                </div>

            </div>


            <!-- Step 2 -->

            <div class="step">

                <div class="step-line"></div>

                <div class="step-content">

                    <div class="step-number">
                        2
                    </div>

                    <span>
                        Delivery
                    </span>

                </div>

            </div>


            <!-- Step 3 -->

            <div class="step">

                <div class="step-line"></div>

                <div class="step-content">

                    <div class="step-number">
                        3
                    </div>

                    <span>
                        Payment
                    </span>

                </div>

            </div>


            <!-- Step 4 -->

            <div class="step">

                <div class="step-line"></div>

                <div class="step-content">

                    <div class="step-number">
                        4
                    </div>

                    <span>
                        Review Order
                    </span>

                </div>

            </div>

        </div>


        <!-- Main Checkout Grid -->

        <div class="checkout-grid">


            <!-- =====================
                 ADDRESS FORM
            ====================== -->

            <div class="checkout-card">

                <h2 class="card-title">
                    Delivery address
                </h2>


                <form id="checkoutForm">


                    <!-- Name + Phone -->

                    <div class="row">

                        <div class="col-md-6">

                            <div class="form-group">

                                <label class="form-label">
                                    Full name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="fullName"
                                    value="Alex Mercer"
                                    required
                                >

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="form-group">

                                <label class="form-label">
                                    Phone
                                </label>

                                <input
                                    type="tel"
                                    class="form-control"
                                    id="phone"
                                    value="+1 415 555 0148"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Street -->

                    <div class="form-group">

                        <label class="form-label">
                            Street address
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="address"
                            value="218 Fillmore St, Apt 4B"
                            required
                        >

                    </div>


                    <!-- City + ZIP -->

                    <div class="row">

                        <div class="col-md-6">

                            <div class="form-group">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="city"
                                    value="San Francisco"
                                    required
                                >

                            </div>

                        </div>


                        <div class="col-md-6">

                            <div class="form-group">

                                <label class="form-label">
                                    ZIP code
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="zip"
                                    value="94117"
                                    required
                                >

                            </div>

                        </div>

                    </div>


                    <!-- Divider -->

                    <div class="form-divider"></div>


                    <!-- Actions -->

                    <div class="d-flex justify-content-between align-items-center form-actions">

                        <button
                            type="button"
                            class="back-btn"
                            onclick="goBackToCart()"
                        >

                            <i class="fas fa-arrow-left me-2"></i>

                            Back to cart

                        </button>


                        <button
                            type="submit"
                            class="continue-btn"
                        >

                            Continue

                            <i class="fas fa-arrow-right ms-2"></i>

                        </button>

                    </div>


                </form>

            </div>


            <!-- =====================
                 ORDER SUMMARY
            ====================== -->

            <aside>

                <div class="summary-card">

                    <h2 class="summary-title">
                        Summary
                    </h2>


                    <div class="summary-row">

                        <span class="label">
                            Items (1)
                        </span>

                        <span class="value">
                            $249
                        </span>

                    </div>


                    <div class="summary-row">

                        <span class="label">
                            Delivery
                        </span>

                        <span class="value free">
                            Free
                        </span>

                    </div>


                    <div class="summary-row">

                        <span class="label">
                            Tax
                        </span>

                        <span class="value">
                            $20
                        </span>

                    </div>


                    <div class="summary-divider"></div>


                    <div class="total-row">

                        <span>
                            Total
                        </span>

                        <span>
                            $269
                        </span>

                    </div>


                    <!-- Secure message -->

                    <div class="secure-box">

                        <i class="fas fa-shield-halved"></i>

                        <div>

                            <strong>Secure checkout</strong>

                            <br>

                            Your payment and personal information are protected.

                        </div>

                    </div>

                </div>

            </aside>


        </div>

    </div>

</main>


<!-- =========================
     JAVASCRIPT
========================== -->

<script>

    const form = document.getElementById("checkoutForm");


    form.addEventListener("submit", function(event) {

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const city =
            document.getElementById("city").value.trim();

        const zip =
            document.getElementById("zip").value.trim();


        if (
            !fullName ||
            !phone ||
            !address ||
            !city ||
            !zip
        ) {

            alert("Please complete all address fields.");

            return;

        }


        // Move to delivery step

        const steps =
            document.querySelectorAll(".step");


        steps[0].classList.remove("active");

        steps[1].classList.add("active");


        alert("Address saved! Moving to delivery.");

        // Later:
        // window.location.href = "/checkout/delivery/";

    });


    function goBackToCart() {

        // Later connect this to Django route

        window.location.href = "/cart/";

    }


    /* Search */

    const searchInput =
        document.querySelector(".nav-search input");


    searchInput.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            const query =
                searchInput.value.trim();

            if (query) {

                console.log(
                    "Searching for:",
                    query
                );

                // Later:
                // window.location.href =
                // `/products/?search=${encodeURIComponent(query)}`;

            }

        }

    });

</script>


</body>
</html>
