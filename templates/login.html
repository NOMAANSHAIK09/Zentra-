{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Zentra</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: #f7f8fc;
            color: #111827;
        }


        /* =========================
           NAVBAR
        ========================== */

        .navbar {
            height: 72px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .navbar-container {
            max-width: 1180px;
            margin: auto;
            padding: 0 20px;
        }

        .brand {
            text-decoration: none;
            color: #111827;
            font-size: 22px;
            font-weight: 700;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            border-radius: 11px;

            background: #6366f1;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
        }

        .nav-text {
            color: #64748b;
            font-size: 14px;
        }

        .signup-link {
            text-decoration: none;
            color: #4f46e5;
            font-weight: 600;
            font-size: 14px;
        }

        .signup-link:hover {
            color: #4338ca;
        }


        /* =========================
           MAIN
        ========================== */

        .login-section {
            min-height: calc(100vh - 72px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px 20px;
        }


        /* =========================
           LOGIN CARD
        ========================== */

        .login-card {
            width: 100%;
            max-width: 455px;

            background: #ffffff;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 42px 45px;

            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.06);
        }


        /* =========================
           HEADING
        ========================== */

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 52px;
            height: 52px;

            margin: 0 auto 18px;

            border-radius: 14px;

            background: #eef0ff;
            color: #6366f1;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
        }

        .login-heading h1 {
            font-size: 25px;
            font-weight: 700;

            margin-bottom: 7px;
        }

        .login-heading p {
            margin: 0;

            color: #64748b;
            font-size: 13px;
        }


        /* =========================
           FORM
        ========================== */

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;

            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #94a3b8;

            font-size: 14px;

            pointer-events: none;
        }

        .form-control {
            height: 48px;

            border: 1px solid #dbe1ea;
            border-radius: 9px;

            font-family: "Poppins", sans-serif;
            font-size: 13px;

            padding-left: 43px;

            box-shadow: none;

            transition: 0.2s;
        }

        .form-control:focus {
            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.10);
        }

        .password-input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;
            background: transparent;

            color: #94a3b8;

            cursor: pointer;

            padding: 5px;
        }

        .password-toggle:hover {
            color: #6366f1;
        }


        /* =========================
           REMEMBER + FORGOT
        ========================== */

        .login-options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 15px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember input {
            accent-color: #6366f1;
        }

        .remember label {
            font-size: 11px;
            color: #64748b;

            cursor: pointer;
        }

        .forgot-link {
            font-size: 11px;
            color: #4f46e5;

            text-decoration: none;

            font-weight: 500;
        }

        .forgot-link:hover {
            color: #4338ca;
        }


        /* =========================
           LOGIN BUTTON
        ========================== */

        .login-btn {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: #6366f1;
            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 14px;
            font-weight: 600;

            margin-top: 22px;

            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #4f46e5;

            transform: translateY(-1px);

            box-shadow:
                0 7px 18px rgba(99, 102, 241, 0.22);
        }

        .login-btn:active {
            transform: translateY(0);
        }


        /* =========================
           DIVIDER
        ========================== */

        .divider {
            display: flex;
            align-items: center;

            gap: 12px;

            margin: 25px 0;
        }

        .divider-line {
            height: 1px;

            background: #e5e7eb;

            flex: 1;
        }

        .divider span {
            color: #94a3b8;

            font-size: 11px;
        }


        /* =========================
           GOOGLE BUTTON
        ========================== */

        .google-btn {
            width: 100%;
            height: 46px;

            border: 1px solid #dbe1ea;
            border-radius: 9px;

            background: white;

            color: #334155;

            font-family: "Poppins", sans-serif;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s;
        }

        .google-btn:hover {
            background: #f8fafc;

            border-color: #cbd5e1;
        }

        .google-btn i {
            margin-right: 9px;
        }


        /* =========================
           SIGNUP
        ========================== */

        .signup-text {
            text-align: center;

            margin-top: 25px;

            font-size: 12px;

            color: #64748b;
        }

        .signup-text a {
            color: #4f46e5;

            font-weight: 600;

            text-decoration: none;
        }

        .signup-text a:hover {
            color: #4338ca;
        }


        /* =========================
           SECURITY NOTE
        ========================== */

        .security-note {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 6px;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 10px;
        }

        .security-note i {
            color: #10b981;
        }


        /* =========================
           RESPONSIVE
        ========================== */

        @media (max-width: 500px) {

            .navbar {
                height: 65px;
            }

            .navbar-container {
                padding: 0 15px;
            }

            .brand {
                font-size: 19px;
            }

            .brand-icon {
                width: 35px;
                height: 35px;
            }

            .nav-text {
                display: none;
            }

            .login-section {
                min-height: calc(100vh - 65px);

                padding: 25px 15px;
            }

            .login-card {
                padding: 32px 22px;

                border-radius: 15px;
            }

            .login-heading h1 {
                font-size: 22px;
            }
        }

    </style>
</head>


<body>


<!-- =========================
     NAVBAR
========================== -->

<nav class="navbar">

    <div class="container-fluid navbar-container h-100">

        <div
            class="d-flex align-items-center justify-content-between h-100"
        >

            <!-- Zentra Logo -->

            <a href="index.html" class="brand">

                <span class="brand-icon">

                    <i class="fa-solid fa-store"></i>

                </span>

                Zentra

            </a>


            <!-- Signup -->

            <div class="d-flex align-items-center gap-3">

                <span class="nav-text">
                    Don't have an account?
                </span>

                <a
                    href="{% url 'signup' %}"
                    class="signup-link"
                >
                    Sign up
                </a>

            </div>

        </div>

    </div>

</nav>



<!-- =========================
     LOGIN SECTION
========================== -->

<section class="login-section">

    <div class="login-card">


        <!-- Heading -->

        <div class="login-heading">

            <div class="login-icon">

                <i class="fa-solid fa-lock"></i>

            </div>

            <h1>
                Welcome back
            </h1>

            <p>
                Log in to continue to your Zentra account.
            </p>

        </div>



        <!-- Form -->

        <form id="loginForm" method="POST" action="{% url 'login' %}">

            {% csrf_token %}


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label"
                >
                    Email address
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-regular fa-envelope input-icon"
                    ></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        placeholder="you@example.com"
                        required
                    >

                </div>

            </div>



            <!-- Password -->

            <div class="mb-0">

                <label
                    for="password"
                    class="form-label"
                >
                    Password
                </label>

                <div class="input-wrapper">

                    <i
                        class="fa-solid fa-lock input-icon"
                    ></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control password-input"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="submit"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >

                        <i
                            class="fa-regular fa-eye"
                            id="passwordIcon"
                        ></i>

                    </button>

                </div>

            </div>



            <!-- Remember / Forgot -->

            <div class="login-options">

                <div class="remember">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <label for="remember">
                        Remember me
                    </label>

                </div>

                <a
                    href="forgot-password.html"
                    class="forgot-link"
                >
                    Forgot password?
                </a>

            </div>



            <!-- Login -->

            <button
                type="submit"
                class="login-btn"
                id="loginButton"
            >

                Log in

            </button>



            <!-- Divider -->

            <div class="divider">

                <div class="divider-line"></div>

                <span>OR</span>

                <div class="divider-line"></div>

            </div>



            <!-- Google -->

            <button
                type="button"
                class="google-btn"
                onclick="googleLogin()"
            >

                <i class="fa-brands fa-google"></i>

                Continue with Google

            </button>


        </form>



        <!-- Signup -->

        <div class="signup-text">

            Don't have a Zentra account?

            <a href="{% url 'signup' %}">
                Create one
            </a>

        </div>



        <!-- Security -->

        <div class="security-note">

            <i class="fa-solid fa-shield-halved"></i>

            Your account information is securely protected.

        </div>


    </div>

</section>



<!-- =========================
     JAVASCRIPT
========================== -->

 <script>


    /* =========================
       PASSWORD TOGGLE
    ========================== */

    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("passwordIcon");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

        }

        else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

        }

    }



    /* =========================
       LOGIN FORM
    ========================== */

    document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const button =
                document.getElementById("loginButton");


            /* Email validation */

            if (!email) {

                alert("Please enter your email address.");

                return;

            }


            /* Password validation */

            if (!password) {

                alert("Please enter your password.");

                return;

            }


            /* Loading */

            button.disabled = true;

            button.innerHTML = `
                <span
                    class="spinner-border spinner-border-sm me-2"
                    role="status"
                ></span>
                Logging in...
            `;


            /*
                FRONTEND DEMO

                Later connect this to
                your Django login endpoint.
            */

            setTimeout(function() {

                alert("Login successful!");

                button.disabled = false;

                button.innerHTML = "Log in";


                /*
                    Later:

                    window.location.href =
                        "home.html";
                */

            }, 1200);

        });



    /* =========================
       GOOGLE LOGIN
    ========================== */

    function googleLogin() {

        alert(
            "Google authentication will be connected here."
        );


        /*
            Later connect this to
            Django Google OAuth.
        */

    }

</script> 


</body>
</html>
